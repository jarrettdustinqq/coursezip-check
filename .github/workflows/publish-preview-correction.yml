name: Publish reviewed preview copy correction
# Temporary coordinator for PR #1; remove after verified publication, before merge.
on:
  push:
    branches: [codex/free-preview-copy-correction-20260910]
    paths: [.github/workflows/publish-preview-correction.yml]
permissions:
  contents: read
concurrency:
  group: publish-preview-copy-correction
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify reviewed bytes, unchanged behavior, and existing checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 tests/make_fixtures.py
          python3 build.py
          git diff --exit-code -- CourseZip-Check-Free.html
          echo 'a3f878a9c0659d504e34073bc7783fb44b8282db91fcead6b8cd067f8bf6decb  CourseZip-Check-Free.html' | sha256sum --check
          git diff --exit-code c46c270615f2807d2af1fea73088723c9c801f30 -- src/core.js src/ui.js build.py tests/core.test.mjs tests/make_fixtures.py qa/browser-check.mjs
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          old = subprocess.check_output(['git', 'show', 'c46c270615f2807d2af1fea73088723c9c801f30:CourseZip-Check-Free.html'], text=True)
          new = Path('CourseZip-Check-Free.html').read_text()
          for pattern in (r'<script>[\s\S]*?</script>', r'<style>[\s\S]*?</style>', r'<meta http-equiv="Content-Security-Policy"[^>]*>'):
              assert re.search(pattern, old).group() == re.search(pattern, new).group()
          print('Script, CSS, and CSP match the previous release source exactly.')
          PY
          npm test
          python3 -m unittest discover -s tests -p 'test_interest_evidence.py' -v
      - name: Exercise the reviewed artifact in offline Chromium
        run: |
          npm install --prefix qa --ignore-scripts --no-audit --no-fund --package-lock=false
          ./qa/node_modules/.bin/playwright install --with-deps chromium
          node qa/browser-check.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish a new preview and verify its public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.1-preview
        run: |
          set -euo pipefail
          echo 'a3f878a9c0659d504e34073bc7783fb44b8282db91fcead6b8cd067f8bf6decb  CourseZip-Check-Free.html' | sha256sum --check
          existing=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name == "v0.1.1-preview") | .id')
          if [ -z "$existing" ]; then
            test "$(gh api "repos/$REPO/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')" = 0
            notes=$(mktemp)
            cat > "$notes" <<EOF
          Description-only correction to the free offline, single-package preview from PR #1. Clarifies one ZIP at a time, no built-in report export, replacement of previous results, and the scope of browser testing. No functional changes: JavaScript, CSS, and CSP are unchanged.

          Validation: 47 engine/distribution checks, 9 interest-evidence checks, and 48 offline Chromium checks on GitHub-hosted Ubuntu passed before publication. The browser tests used synthetic packages, including a >1 GiB sparse ZIP; no page errors or HTTP(S) requests were observed. Other browsers, operating systems, real customer exports, SCORM certification, and LMS runtime behavior remain unverified.

          Source commit: $GITHUB_SHA
          Validation run: https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID
          Artifact: CourseZip-Check-Free.html (30,355 bytes)
          SHA-256: a3f878a9c0659d504e34073bc7783fb44b8282db91fcead6b8cd067f8bf6decb

          The v0.1.0-preview release is preserved. The free preview remains free; the separate batch edition is not for sale.
          EOF
            gh release create "$RELEASE_TAG" CourseZip-Check-Free.html --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false --title 'CourseZip Check 0.1.1 — preview description correction' --notes-file "$notes"
          fi
          test "$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          public_file=$(mktemp)
          curl --fail --location --silent --show-error --retry 3 --max-time 60 "https://github.com/$REPO/releases/download/$RELEASE_TAG/CourseZip-Check-Free.html" --output "$public_file"
          cmp CourseZip-Check-Free.html "$public_file"
          sha256sum "$public_file"
          python3 tests/remote_snapshot.py
